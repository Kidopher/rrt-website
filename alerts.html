<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RRT Alerts</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
}

.topbar {
    background: #111827;
    color: white;
    padding: 6px 15px;
    font-size: 12px;
}

header {
    background: #dc2626;
    color: white;
    padding: 20px;
    text-align: center;
}

nav {
    background: white;
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

nav a {
    margin: 0 10px;
    text-decoration: none;
    color: #1d4ed8;
    font-weight: bold;
    padding: 6px 10px;
    border-radius: 4px;
}

nav a:hover {
    background: #e0e7ff;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
}

/* dropdown */
select {
    padding: 8px;
    margin-bottom: 15px;
}

/* alert cards */
.alert {
    background: white;
    padding: 15px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-left: 6px solid;
}

.alert.delay {
    border-left-color: #f59e0b;
}

.alert.disruption {
    border-left-color: #dc2626;
}

.alert.info {
    border-left-color: #2563eb;
}
</style>

</head>

<body>

<div class="topbar">RRT Service Alerts</div>

<header>
<h1>Service Alerts</h1>
<p>Current System Notices</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="routes.html">Routes</a>
<a href="alerts.html">Service Alerts</a>
</nav>

<div class="container">

<!-- dropdown -->
<select id="filter" onchange="filterAlerts()">
    <option value="all">All Alerts</option>
    <option value="delay">Delays</option>
    <option value="disruption">Disruptions</option>
    <option value="info">Info</option>
</select>

<!-- alerts -->
<div class="alert info" data-type="info">
No current disruptions.
</div>

<div class="alert delay" data-type="delay">
Route 2 may experience minor delays due to traffic.
</div>

<div class="alert disruption" data-type="disruption">
Route 3 service temporarily suspended.
</div>

</div>

<script>
function filterAlerts() {
    let value = document.getElementById("filter").value;
    let alerts = document.querySelectorAll(".alert");

    alerts.forEach(alert => {
        if (value === "all") {
            alert.style.display = "block";
        } else {
            if (alert.dataset.type === value) {
                alert.style.display = "block";
            } else {
                alert.style.display = "none";
            }
        }
    });
}
</script>

</body>
</html>
