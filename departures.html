<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RRT Station Board</title>

<style>
body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: #050816;
    color: #00ff9d;
}

header {
    background: #111827;
    padding: 15px;
    text-align: center;
    border-bottom: 2px solid #00ff9d;
}

.board {
    max-width: 1000px;
    margin: 20px auto;
    border: 2px solid #00ff9d;
}

.row {
    display: grid;
    grid-template-columns: 1fr 3fr 1fr 1fr;
    padding: 10px;
    border-bottom: 1px solid rgba(0,255,157,0.2);
}

.alert {
    text-align: center;
    padding: 8px;
    font-weight: bold;
}

.green { background: #16a34a; color: white; }
.yellow { background: #f59e0b; color: black; }
.red { background: #dc2626; color: white; }
</style>
</head>

<body>

<header>
<h1>STATION DEPARTURE BOARD</h1>
</header>

<div id="alert" class="alert"></div>

<div class="board">
<div class="row">
<b>Route</b><b>Destination</b><b>Departs</b><b>Status</b>
</div>

<div id="rows"></div>
</div>

<script>
function load() {
    let data = JSON.parse(localStorage.getItem("departures") || "[]");
    let level = localStorage.getItem("alertLevel") || "green";

    let alertBox = document.getElementById("alert");

    alertBox.className = "alert " + level;

    alertBox.innerText =
        level === "green" ? "Normal Service" :
        level === "yellow" ? "Minor Delays Network-Wide" :
        "Major Service Disruption";

    rows.innerHTML = data.map(d => `
        <div class="row">
            <div>${d.route}</div>
            <div>${d.dest}</div>
            <div>${d.time} min</div>
            <div>${d.status}</div>
        </div>
    `).join("");
}

setInterval(load, 2000);
load();
</script>

</body>
</html>
